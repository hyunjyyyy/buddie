name: scrape

on:
  schedule:
    # KST 08:00, 18:00. GitHub 일정 실행은 수십 분 늦게 도는 일이 흔하다.
    - cron: "0 23 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 상세는 한 번에 300건(1초 간격)까지라 최악 10분 안팎.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scraper/main.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json data/detail-cache.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): 공고 갱신"
            git push
          fi
